name: Daily Literature Digest

on:
  schedule:
    # 8:00 AM Central Time = 14:00 UTC (CDT, Mar-Nov)
    # Adjust to 15:00 UTC in winter (CST, Nov-Mar) by editing the line below
    - cron: "0 14 * * *"
  workflow_dispatch:  # allows manual trigger from GitHub UI

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Restore the seen-articles cache so we don't re-send duplicates
      - name: Restore seen articles cache
        uses: actions/cache@v4
        with:
          path: seen_articles.json
          key: seen-articles-${{ github.run_id }}
          restore-keys: |
            seen-articles-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run literature agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS:     ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python lit_agent.py

      # Save updated seen-articles so tomorrow's run knows what was already sent
      - name: Save seen articles cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: seen_articles.json
          key: seen-articles-${{ github.run_id }}
