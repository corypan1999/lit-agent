name: Daily Literature Digest

on:
  schedule:
    # 8:00 AM Central Time = 14:00 UTC (CDT, Mar-Nov)
    # Adjust to 15:00 UTC in winter (CST, Nov-Mar) by editing the line below
    - cron: "0 14 * * *"
  workflow_dispatch:  # allows manual trigger from GitHub UI

jobs:
  run-agent:
    runs-on: ubuntu-latest

    # Allow the workflow to commit seen_articles.json back to the repo
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run literature agent
        env:
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS:      ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAILS:   ${{ secrets.RECIPIENT_EMAILS }}
        run: python lit_agent.py

      # Commit the updated seen_articles.json so it persists reliably
      - name: Save seen articles to repo
        if: always()
        run: |
          git config user.name  "lit-agent"
          git config user.email "lit-agent@noreply"
          git add seen_articles.json
          git diff --cached --quiet || git commit -m "chore: update seen articles [skip ci]"
          git push
